components:
  schemas:
    ProfileRequest:
      required:
        - username
      type: object
      properties:
        username:
          maxLength: 100
          minLength: 0
          type: string
        mobileNumber:
          pattern: "^$|^[6-9][0-9]{9}$"
          type: string
    UserView:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        email:
          type: string
        username:
          type: string
        mobileNumber:
          type: string
        userRole:
          type: string
    AddressRequest:
      required:
        - city
        - label
        - line1
        - postalCode
        - state
      type: object
      properties:
        label:
          maxLength: 40
          minLength: 0
          type: string
        line1:
          maxLength: 250
          minLength: 0
          type: string
        city:
          maxLength: 80
          minLength: 0
          type: string
        state:
          maxLength: 80
          minLength: 0
          type: string
        postalCode:
          maxLength: 12
          minLength: 0
          type: string
    AddressView:
      type: object
      properties:
        addressId:
          type: integer
          format: int64
        label:
          type: string
        line1:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
    OrderUpdateRequest:
      type: object
