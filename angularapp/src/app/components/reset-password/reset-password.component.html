<section class="grid min-h-[62vh] place-items-center px-5 py-12">
  <div
    class="w-full max-w-[520px] rounded-3xl bg-[#f3eee7] p-[clamp(28px,5vw,54px)] text-[#1d1b19] dark:border dark:border-[#8c754f]/40 dark:bg-[#29231f] dark:text-[#f8f4ee]"
  >
    <p class="eyebrow">Secure account setup</p>
    <h1 class="my-[10px] font-display text-[clamp(34px,6vw,52px)]">
      Choose a password
    </h1>
    <p class="leading-[1.7] text-[#665f58] dark:text-[#d6c9b9]">
      Use 8–72 characters with uppercase, lowercase, a number and a symbol.
    </p>
    <p class="success dark:text-emerald-300" *ngIf="message" role="status">
      {{ message }}
    </p>
    <p class="error dark:text-red-300" *ngIf="error" role="alert">
      {{ error }}
    </p>
    <form class="mt-[22px] grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <label
        >New password<span class="password-field"
          ><input
            class="!border-[#8a8077] !bg-white !text-[#1d1b19] dark:!border-[#9a8b7a] dark:!bg-[#1c1916] dark:!text-[#f8f4ee] [&::-ms-reveal]:hidden [&::-ms-clear]:hidden"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
          /><button
            type="button"
            class="password-toggle dark:!text-[#f8f4ee]"
            (click)="showPassword = !showPassword"
          >
            {{ showPassword ? "Hide" : "Show" }}
          </button></span
        ></label
      >
      <label
        >Confirm password<span class="password-field"
          ><input
            class="!border-[#8a8077] !bg-white !text-[#1d1b19] dark:!border-[#9a8b7a] dark:!bg-[#1c1916] dark:!text-[#f8f4ee] [&::-ms-reveal]:hidden [&::-ms-clear]:hidden"
            [type]="showConfirm ? 'text' : 'password'"
            formControlName="confirmPassword"
            autocomplete="new-password"
          /><button
            type="button"
            class="password-toggle dark:!text-[#f8f4ee]"
            (click)="showConfirm = !showConfirm"
          >
            {{ showConfirm ? "Hide" : "Show" }}
          </button></span
        ></label
      >
      <small
        *ngIf="form.controls.password.touched && form.controls.password.invalid"
        class="block text-[#a33a31] dark:text-red-300"
        role="alert"
      >
        Password must be 8 to 72 characters and include uppercase, lowercase, a
        number and a symbol.
      </small>
      <small
        *ngIf="
          form.controls.confirmPassword.touched &&
          form.controls.confirmPassword.hasError('required')
        "
        class="block text-[#a33a31] dark:text-red-300"
        role="alert"
        >Confirm your password.</small
      >
      <small
        class="block text-[#a33a31] dark:text-red-300"
        *ngIf="form.touched && form.hasError('passwordMismatch')"
        >Passwords must match.</small
      ><button type="submit" [disabled]="saving">
        {{ saving ? "Saving…" : "Save password" }}
      </button>
    </form>
  </div>
</section>
