<ng-container *ngIf="confirmation.request$ | async as request">
    <div
      class="fixed inset-0 z-[80] bg-black/[.58]"
      (click)="confirmation.answer(false)"
    ></div>
    <section
      class="fixed left-1/2 top-1/2 z-[81] w-[min(440px,calc(100vw-32px))] -translate-x-1/2 -translate-y-1/2 rounded-2xl bg-[#f9f8f6] p-[30px] text-[#27221e] shadow-[0_20px_70px_rgba(0,0,0,.25)] dark:bg-[#27221e] dark:text-[#f9f8f6]"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="dialog-title"
      aria-describedby="dialog-message"
    >
      <p class="eyebrow">Please confirm</p>
      <h2 id="dialog-title" class="my-[10px] font-display text-[29px]">
        {{ request.title }}
      </h2>
      <p
        id="dialog-message"
        class="text-sm leading-[1.6] text-[#6c6863] dark:text-[#d9d0c5]"
      >
        {{ request.message }}
      </p>
      <div class="mt-[25px] flex justify-end gap-3">
        <button
          type="button"
          class="btn-outline"
          (click)="confirmation.answer(false)"
        >
          Keep it
        </button>
        <button type="button" (click)="confirmation.answer(true)">
          {{ request.action }}
        </button>
      </div>
    </section>
  </ng-container>
