<section class="grid min-h-[62vh] place-items-center px-5 py-12">
    <div
      class="w-full max-w-[520px] rounded-3xl bg-[var(--paper,#f3eee7)] p-[clamp(28px,5vw,54px)]"
    >
      <p class="eyebrow">Account recovery</p>
      <h1 class="my-[10px] font-display text-[clamp(34px,6vw,52px)]">
        Reset your password
      </h1>
      <p class="leading-[1.7] text-[var(--muted,#665f58)]">
        Enter your account email and we will send a one-hour reset link.
      </p>
      <p class="success" *ngIf="message" role="status">{{ message }}</p>
      <p class="error" *ngIf="error" role="alert">{{ error }}</p>
      <form class="mt-[22px] grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
        <label
          >Email address
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="you@example.com"
          />
          <small
            class="error-text"
            *ngIf="form.controls.email.touched && form.controls.email.invalid"
            >Enter a valid email address.</small
          > </label
        ><button type="submit" [disabled]="saving">
          {{ saving ? "Sending…" : "Send reset link" }}
        </button>
      </form>
      <p class="auth-switch"><a routerLink="/login">Back to sign in</a></p>
    </div>
  </section>
