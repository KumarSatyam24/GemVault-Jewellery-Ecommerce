<div
  class="fixed bottom-4 right-4 z-[70] overflow-hidden border bg-charcoal shadow-[0_16px_45px_rgba(0,0,0,.22)] transition-[width,height,border-radius,border-color,box-shadow] duration-[540ms] motion-reduce:!transition-none dark:bg-[#151312] max-[520px]:bottom-3 max-[520px]:right-3"
  [ngClass]="
    open
      ? 'h-[min(540px,calc(100dvh-32px))] w-[min(380px,calc(100vw-24px))] rounded-[18px] border-charcoal/10 shadow-[0_24px_72px_rgba(16,14,12,.22)] ease-[cubic-bezier(.25,.46,.45,.94)] dark:border-white/15'
      : 'h-[54px] w-[216px] rounded-[16px] border-[#765e39]/60 ease-[cubic-bezier(.4,0,.2,1)]'
  "
>
  <section
    id="gemvault-chat-panel"
    role="dialog"
    aria-label="GemVault help chat"
    [attr.aria-hidden]="!open"
    [attr.inert]="open ? null : ''"
    [ngClass]="
      open
        ? 'opacity-100 delay-[250ms] duration-[230ms]'
        : 'opacity-0 delay-0 duration-100'
    "
    class="absolute bottom-0 right-0 flex h-[min(540px,calc(100dvh-32px))] w-[min(380px,calc(100vw-24px))] flex-col overflow-hidden rounded-[17px] bg-[#f8f6f2] text-charcoal transition-opacity ease-out motion-reduce:!transition-none dark:bg-[#211d1a] dark:text-[#f5f1eb]"
  >
    <header
      class="flex items-center justify-between gap-3 border-b border-white/10 bg-charcoal px-5 py-4 text-[#f5f1eb] dark:bg-[#151312]"
    >
      <span
        class="whitespace-nowrap font-display text-[20px] leading-none tracking-[-.05em]"
        >GEMVAULT<span class="ml-1 text-[16px] text-[#c8a268]">◇</span></span
      >
      <div class="flex items-center gap-1">
        <button
          *ngIf="bubbles.length || draft"
          type="button"
          class="rounded-full px-2.5 py-2 text-[10px] font-semibold uppercase tracking-[.12em] text-[#d4c8b9] transition-colors duration-200 hover:text-white disabled:opacity-40"
          (click)="clear()"
          [disabled]="sending"
          aria-label="Clear chat"
        >
          Clear
        </button>
        <button
          type="button"
          class="grid h-9 w-9 place-items-center rounded-full text-[#e7ded2] transition-colors duration-200 hover:bg-white/10 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-gold"
          (click)="toggle()"
          aria-label="Close chat"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="M4 4l12 12M16 4L4 16" />
          </svg>
        </button>
      </div>
    </header>

    <div
      #scrollArea
      class="min-h-0 flex-1 space-y-5 overflow-y-auto px-5 py-6"
      aria-live="polite"
    >
      <div *ngIf="!bubbles.length && !loadingHistory" class="pt-1">
        <h2 class="m-0 font-display text-[29px] leading-tight">
          How can we help?
        </h2>
        <p
          class="mb-0 mt-3 max-w-[295px] text-sm leading-6 text-[#514d49] dark:text-[#d3c9bf]"
        >
          Ask about jewellery, orders or your account.
        </p>
        <div class="mt-8 border-t border-charcoal/10 dark:border-white/15">
          <button
            *ngFor="let suggestion of suggestions"
            type="button"
            class="block w-full border-b border-charcoal/10 py-3 text-left text-[13px] leading-5 text-charcoal transition-colors duration-150 hover:text-[#936b2c] focus-visible:outline focus-visible:outline-2 focus-visible:outline-gold dark:border-white/15 dark:text-[#f5f1eb] dark:hover:text-gold"
            (click)="send(suggestion)"
          >
            {{ suggestion }}
          </button>
        </div>
      </div>
      <p
        *ngIf="loadingHistory"
        class="m-0 text-sm text-muted dark:text-[#c6bbb0]"
      >
        Opening your conversation…
      </p>
      <div
        *ngFor="let bubble of bubbles"
        class="flex"
        [class.justify-end]="bubble.role === 'user'"
      >
        <div
          *ngIf="bubble.role === 'user'"
          class="max-w-[88%] rounded-[18px] rounded-br-[5px] bg-charcoal px-4 py-3 text-[#f5f1eb] shadow-sm dark:bg-[#d9c6aa] dark:text-[#1a1715]"
        >
          <p class="m-0 whitespace-pre-line break-words text-sm leading-[1.6]">
            {{ bubble.text }}
          </p>
        </div>
        <div
          *ngIf="bubble.role === 'assistant'"
          class="max-w-[92%] border-l-2 border-gold/80 py-1 pl-4 pr-2 text-charcoal dark:text-[#f5f1eb]"
        >
          <p class="m-0 whitespace-pre-line break-words text-sm leading-[1.7]">
            {{ displayText(bubble.text) }}
          </p>
        </div>
      </div>
      <div
        *ngIf="sending"
        class="flex items-center gap-2 border-l-2 border-gold/80 py-1 pl-4 text-xs text-muted dark:text-[#c6bbb0]"
        role="status"
      >
        <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-gold"></span>
        <span
          class="h-1.5 w-1.5 animate-pulse rounded-full bg-gold/70 [animation-delay:150ms]"
        ></span>
        <span
          class="h-1.5 w-1.5 animate-pulse rounded-full bg-gold/40 [animation-delay:300ms]"
        ></span>
        <span class="ml-1">Finding an answer…</span>
      </div>
      <p
        *ngIf="error"
        role="alert"
        class="m-0 text-xs text-[#a33a31] dark:text-[#e8a69d]"
      >
        {{ error }}
      </p>
    </div>

    <form
      class="border-t border-charcoal/10 bg-white/85 px-4 py-4 dark:border-white/10 dark:bg-[#29231f]"
      (ngSubmit)="send()"
    >
      <div
        class="flex items-center rounded-[11px] border border-charcoal/20 bg-[#f8f6f2] transition-colors focus-within:border-gold dark:border-white/20 dark:bg-[#342d28]"
      >
        <input
          #messageInput
          type="text"
          name="message"
          [(ngModel)]="draft"
          maxlength="1000"
          autocomplete="off"
          placeholder="Ask a question…"
          aria-label="Ask GemVault a question"
          class="!mt-0 !min-h-[46px] !w-auto min-w-0 flex-1 !rounded-none !border-0 !bg-transparent !px-3 !py-3 text-sm !text-charcoal !ring-0 outline-none placeholder:text-muted focus:!border-0 focus:!ring-0 dark:!text-[#f5f1eb] dark:placeholder:text-[#b6aaa0]"
        />
        <button
          type="submit"
          [disabled]="sending || !draft.trim()"
          class="!grid !h-[44px] !w-[44px] !min-h-[44px] shrink-0 place-items-center !rounded-none !border-0 !bg-transparent !p-0 !text-[#9b722f] transition-colors duration-150 hover:!text-charcoal disabled:cursor-not-allowed disabled:!opacity-40 dark:!text-gold dark:hover:!text-[#f5f1eb]"
          aria-label="Send message"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m4 12 16-8-4 16-4-7-8-1Z" />
            <path d="m12 13 8-9" />
          </svg>
        </button>
      </div>
    </form>
  </section>

  <button
    #launcher
    type="button"
    class="absolute inset-0 inline-flex h-[52px] w-full items-center justify-center gap-3 rounded-[15px] px-4 text-[#f5f1eb] transition-[opacity,background-color] hover:bg-white/5 motion-reduce:!transition-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[-3px] focus-visible:outline-gold"
    [ngClass]="
      open
        ? 'pointer-events-none opacity-0 delay-0 duration-75'
        : 'opacity-100 delay-[370ms] duration-150'
    "
    [attr.inert]="open ? '' : null"
    [attr.aria-hidden]="open"
    [attr.aria-expanded]="open"
    aria-controls="gemvault-chat-panel"
    (click)="toggle()"
    aria-label="Open GemVault help chat"
  >
    <span
      class="whitespace-nowrap font-display text-[20px] leading-none tracking-[-.05em]"
      >GEMVAULT<span class="ml-1 text-[16px] text-[#c8a268]">◇</span></span
    >
    <span class="h-5 w-px shrink-0 bg-white/25" aria-hidden="true"></span>
    <span
      class="text-[11px] font-semibold uppercase tracking-[.12em] text-[#e6d5b8]"
      >Help</span
    >
  </button>
</div>
