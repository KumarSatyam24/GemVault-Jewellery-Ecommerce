<section class="grid min-h-[62vh] place-items-center px-5 py-12">
    <div
      class="w-full max-w-[520px] rounded-3xl bg-[var(--paper,#f3eee7)] p-[clamp(28px,5vw,54px)]"
    >
      <p class="eyebrow">GemVault account</p>
      <h1 class="my-[10px] font-display text-[clamp(34px,6vw,52px)]">
        {{ title }}
      </h1>
      <p *ngIf="loading" class="leading-[1.7] text-[var(--muted,#665f58)]">
        {{ message }}
      </p>
      <p *ngIf="!loading && !error" class="success" role="status">
        {{ message }}
      </p>
      <p *ngIf="error" class="error" role="alert">{{ error }}</p>
      <a *ngIf="!loading && error" routerLink="/login" class="mt-4 inline-block"
        >Return to sign in</a
      >
    </div>
  </section>
