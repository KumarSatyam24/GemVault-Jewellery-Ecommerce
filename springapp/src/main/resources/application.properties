spring.jpa.hibernate.ddl-auto=create
spring.datasource.url=jdbc:mysql://localhost/appdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=examly
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
enable.swagger.plugin=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
server.port:8080
gemvault.jwt.secret=${GEMVAULT_JWT_SECRET:GemVaultLocalDevelopmentSecretChangeBeforeDeployment2026}


gemvault.app.url=${GEMVAULT_APP_URL:http://localhost:8081}
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}
gemvault.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
gemvault.google.client-id=${GOOGLE_CLIENT_ID:}
gemvault.google.client-secret=${GOOGLE_CLIENT_SECRET:}
gemvault.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
server.forward-headers-strategy=framework
gemini.api.key=${GEMINI_API_KEY:}
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
gemini.generation.model=${GEMINI_GENERATION_MODEL:gemini-3.1-flash-lite}
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.try-on.model=${OPENROUTER_TRY_ON_MODEL:black-forest-labs/flux.2-klein-4b}
openrouter.try-on.total-limit=${OPENROUTER_TRY_ON_TOTAL_LIMIT:60}
openrouter.try-on.daily-user-limit=${OPENROUTER_TRY_ON_DAILY_USER_LIMIT:3}
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
chatbot.similarity.threshold=${CHATBOT_SIMILARITY_THRESHOLD:0.65}
chatbot.lexical.threshold=${CHATBOT_LEXICAL_THRESHOLD:0.08}


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.examly.springapp.controller
